<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テスト分析アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📊 テスト画像分析ツール</h1>
        <p>テストの画像をアップロードしてください。<br>AIが自動で採点結果を読み取り、分析Excelを作成します。</p>

        <div class="upload-area">
            <input type="file" id="fileInput" accept="image/*">
            <button id="uploadBtn" onclick="startAnalysis()">分析スタート</button>
        </div>

        <div id="statusMessage" class="status"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
